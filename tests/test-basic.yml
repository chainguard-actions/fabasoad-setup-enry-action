---
name: Test basic usage (default version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run setup-enry-action with default version
        id: action
        uses: .
      - name: Assert enry is on PATH
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH"
            exit 1
          fi
          echo "PASS: enry is available"
      - name: Assert enry runs successfully
        run: |
          echo "Running enry --version..."
          enry --version || true
          echo "Running enry on current directory..."
          enry . || enry
          echo "PASS: enry executed successfully"
