---
name: Test basic usage (latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert enry is on PATH and runs
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH"
            exit 1
          fi
          echo "enry found at: $(command -v enry)"
          enry --version
          echo "PASS"
