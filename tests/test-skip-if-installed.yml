---
name: Test skip if already installed (force=false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: First install of enry
        id: first-install
        uses: .
        with:
          version: latest
          force: "false"
          github-token: ${{ github.token }}
      - name: Assert first install succeeded
        env:
          ACTUAL: ${{ steps.first-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true for first install but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: first install succeeded"
      - name: Verify enry is available after first install
        run: |
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found after first install"
            exit 1
          fi
          echo "enry found at: $(command -v enry)"
          enry --version
      - name: Run action with force=false (should skip install since enry is already installed)
        id: skip-install
        uses: .
        with:
          version: latest
          force: "false"
          github-token: ${{ github.token }}
      - name: Assert install was skipped (installed=false)
        env:
          ACTUAL: ${{ steps.skip-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          # When enry is already installed and force=false, the install-enry step
          # is skipped, so its outcome != 'success', meaning installed=false
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed=false (skipped) but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: install was correctly skipped"
      - name: Assert enry is still available
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH"
            exit 1
          fi
          echo "enry found at: $(command -v enry)"
          enry --version
          echo "PASS"
