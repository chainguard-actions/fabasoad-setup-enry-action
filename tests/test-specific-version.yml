---
name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "1.3.0"
          github-token: ${{ github.token }}
      - name: Assert installed output is true
        env:
          ACTUAL: ${{ steps.action.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected installed=true but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert enry is on PATH and correct version
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH"
            exit 1
          fi
          echo "enry found at: $(command -v enry)"
          VERSION_OUTPUT="$(enry --version)"
          echo "Version output: $VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "1.3.0"; then
            echo "FAIL: expected version 1.3.0 in output but got: $VERSION_OUTPUT"
            exit 1
          fi
          echo "PASS"
