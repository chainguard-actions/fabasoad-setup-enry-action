name: Test force=false skips installation when enry already installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Pre-install fake enry binary
        run: |
          cat > /usr/local/bin/enry << 'EOF'
          #!/bin/sh
          echo "enry version 2.5.0"
          EOF
          chmod +x /usr/local/bin/enry
      - name: Verify enry is available
        run: |
          enry --version
      - name: Call action with force=false (should skip)
        id: skip-install
        uses: .
        with:
          version: "2.5.0"
          force: "false"
          github-token: ${{ github.token }}
      - name: Assert skip-install output is false
        env:
          ACTUAL: ${{ steps.skip-install.outputs.installed }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "false" ]; then
            echo "FAIL: expected installed='false' when skipping, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: installation was correctly skipped with force=false"
      - name: Assert enry is still available after skip
        run: |
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH after skip"
            exit 1
          fi
          enry --version
          echo "PASS"
