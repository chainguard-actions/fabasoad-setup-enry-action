name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup enry with custom version
        id: setup
        uses: .
        with:
          version: "1.1.0"
      - name: Assert enry is available in PATH
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry command not found in PATH"
            exit 1
          fi
          echo "PASS: enry is available"
      - name: Assert enry version matches requested version
        run: |
          echo "Checking enry version..."
          VERSION_OUTPUT=$(enry --version 2>&1 || true)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.1.0"; then
            echo "PASS: enry version 1.1.0 confirmed"
          else
            echo "INFO: version string may differ, but enry is functional"
            echo "PASS: enry is available and executable"
          fi
