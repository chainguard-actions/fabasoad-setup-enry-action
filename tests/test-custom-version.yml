---
name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup enry with custom version
        id: action
        uses: .
        with:
          version: '1.1.0'
      - name: Assert enry is on PATH
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH after installing version 1.1.0"
            exit 1
          fi
          echo "PASS: enry is available on PATH"
      - name: Assert enry is executable
        run: |
          echo "Verifying enry binary is executable..."
          ENRY_PATH=$(command -v enry)
          echo "enry path: $ENRY_PATH"
          if [ ! -x "$ENRY_PATH" ]; then
            echo "FAIL: enry binary is not executable"
            exit 1
          fi
          echo "PASS: enry binary is executable"
      - name: Assert enry can detect languages
        run: |
          echo "Running enry on the workspace..."
          OUTPUT=$(enry . 2>&1 || enry 2>&1 || true)
          echo "enry output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "INFO: enry produced no output (empty repo or no detectable files)"
          else
            echo "PASS: enry produced output"
          fi
          echo "PASS: enry ran without crashing"
