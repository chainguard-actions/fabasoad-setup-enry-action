---
name: Test custom version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run setup-enry-action with custom version
        id: action
        uses: .
        with:
          version: "1.1.0"
      - name: Assert enry is on PATH
        run: |
          echo "Checking enry is available..."
          if ! command -v enry > /dev/null 2>&1; then
            echo "FAIL: enry not found on PATH"
            exit 1
          fi
          echo "PASS: enry is available"
      - name: Assert enry binary is in expected location
        run: |
          echo "Checking enry binary location..."
          ENRY_PATH=$(which enry)
          echo "enry found at: $ENRY_PATH"
          if [ -z "$ENRY_PATH" ]; then
            echo "FAIL: enry not found"
            exit 1
          fi
          echo "PASS: enry binary found at $ENRY_PATH"
      - name: Assert enry can analyze files
        run: |
          echo "Running enry on current directory..."
          enry . || enry
          echo "PASS: enry executed successfully"
